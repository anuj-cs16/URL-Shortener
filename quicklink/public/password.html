<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Protected Link — QuickLink</title>
  <meta name="description" content="This shortened URL is password protected. Please enter the password to proceed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <style>
    :root {
      --primary-color: #6C63FF;
      --primary-hover: #5A52E5;
      --primary-light: rgba(108, 99, 255, 0.15);
      --secondary-color: #3ECFCF;
      --bg-color: #0F0F1A;
      --card-bg: rgba(26, 26, 46, 0.8);
      --card-border: rgba(42, 42, 62, 0.6);
      --text-primary: #FFFFFF;
      --text-secondary: #A0A0B0;
      --text-muted: #6E6E80;
      --error-color: #FF5252;
      --error-bg: rgba(255, 82, 82, 0.1);
      --border-color: #2A2A3E;
      --font-family: 'Inter', sans-serif;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(108, 99, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(62, 207, 207, 0.08) 0%, transparent 40%);
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .error-banner {
      background: var(--error-bg);
      border: 1px solid rgba(255, 82, 82, 0.2);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--error-color);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      background: rgba(15, 15, 26, 0.7);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: white;
      font-family: var(--font-family);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .btn-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      font-family: var(--font-family);
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108, 99, 255, 0.4);
    }

    .footer-text {
      margin-top: 30px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="lock-icon">🔒</span>
    <h1 class="title">Password Protected Link</h1>
    <p class="subtitle">This link is restricted. Please enter the access password to continue to the destination.</p>
    
    <div class="error-banner" id="error-banner">
      <span>⚠️</span>
      <span id="error-text">Invalid password. Please try again.</span>
    </div>

    <form action="" method="GET">
      <div class="form-group">
        <label for="password" class="input-label">Access Password</label>
        <input type="password" id="password" name="password" class="input-field" placeholder="Enter password" required autofocus>
      </div>
      <button type="submit" class="btn-submit">🔓 Unlock & Proceed</button>
    </form>
  </div>
  <p class="footer-text">© 2026 QuickLink · Protected by Enterprise Security</p>

  <script>
    // Show error banner if error query parameter is present
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error') || urlParams.has('wrong')) {
      document.getElementById('error-banner').style.display = 'flex';
    }
  </script>
</body>
</html>
